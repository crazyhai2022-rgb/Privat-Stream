# Development / single-server deployment.
# Set the secrets in server/.env before running: docker compose up --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: viralx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/viralx
    ports:
      - "4000:4000"
    volumes:
      # Only needed with STORAGE_DRIVER=local; omit when using S3-compatible storage.
      - media:/app/server/storage-data
      - tmp:/app/server/tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  tmp:
